<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05030f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Jungle Run</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="wrap"><canvas id="c" aria-label="Jungle Run game"></canvas>
<div id="top"><button id="pz" aria-label="Pause">II</button><button id="fs" aria-label="Fullscreen">&#x26F6;</button></div></div>
<div id="rot">TURN YOUR DEVICE SIDEWAYS FOR A BIGGER SCREEN</div>
<div id="help">ARROWS / WASD move &amp; aim &nbsp; X K SPACE jump &nbsp; Z J fire &nbsp; P pause &nbsp; F fullscreen<br>DOWN = prone &nbsp; DOWN + JUMP on a bridge = drop &nbsp; Gamepads work too</div>
<div id="pad">
<div id="dpad"><button data-k="T_U T_L">&#x2196;</button><button data-k="T_U">&#x25B2;</button><button data-k="T_U T_R">&#x2197;</button><button data-k="T_L">&#x25C0;</button><i></i><button data-k="T_R">&#x25B6;</button><button data-k="T_D T_L">&#x2199;</button><button data-k="T_D">&#x25BC;</button><button data-k="T_D T_R">&#x2198;</button></div>
<div id="act"><button data-k="T_J">JUMP</button><button data-k="T_F">FIRE</button></div></div>
<script src="game.js"></script></body></html>
